name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Every new main tip can supersede a pending publication, including docs-only pushes.
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.serena/**'
  workflow_dispatch:
    inputs:
      run_heavy_checks:
        description: 'Run heavy release checks (coverage, JS budget, E2E, visual, perf, Docker)'
        type: boolean
        default: true
      update_visual_snapshots:
        description: 'Also upload updated visual snapshots artifact (does not commit)'
        type: boolean
        default: false
      publish_image:
        description: 'Publish from main or a release tag after full CI'
        type: boolean
        default: false

concurrency:
  # Let publishing runs finish independently. The publisher serializes registry writes.
  group: ci-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.publish_image) && github.run_id || github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      heavy: ${{ steps.filter.outputs.heavy }}
      visual: ${{ steps.filter.outputs.visual }}
      docker: ${{ steps.filter.outputs.docker }}
      publish: ${{ steps.filter.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute affected scopes
        id: filter
        env:
          RUN_HEAVY: ${{ inputs.run_heavy_checks }}
          UPDATE_VISUAL: ${{ inputs.update_visual_snapshots }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          heavy=false
          visual=false
          docker=false
          publish=false

          if [[ "$GITHUB_EVENT_NAME" == push ]] ||
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_IMAGE" == true ]]; then
            number='(0|[1-9][0-9]*)'
            identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
            release_ref="^refs/tags/v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
            if [[ "$GITHUB_REF" != refs/heads/main && ! "$GITHUB_REF" =~ $release_ref ]]; then
              echo 'Image publishing requires main or a vMAJOR.MINOR.PATCH release tag (optional prerelease).'
              exit 1
            fi

            backend=true
            frontend=true
            docker=true
            publish=true
            if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              heavy=true
              visual=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            backend=true
            frontend=true
            if [[ "$RUN_HEAVY" == true ]]; then
              heavy=true
              visual=true
              docker=true
            fi
            if [[ "$UPDATE_VISUAL" == true ]]; then
              visual=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if grep -Eq '^(backend/|\.github/workflows/ci\.yml$)' <<<"$files"; then
              backend=true
            fi
            if grep -Eq '^(frontend/|scripts/|\.github/workflows/ci\.yml$)' <<<"$files"; then
              frontend=true
            fi
            if grep -Eq '^(docker/|Dockerfile$|\.dockerignore$|Caddyfile$|docker-compose\.yml$|\.env\.example$|\.github/workflows/(ci|docker-publish)\.yml$)' <<<"$files"; then
              docker=true
            fi
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "heavy=$heavy"
            echo "visual=$visual"
            echo "docker=$docker"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test -race ./...

      - name: Run Go vet
        working-directory: backend
        run: go vet ./...

      - name: Verify Go formatting
        working-directory: backend
        run: |
          unformatted="$(find . -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint:strict

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run script unit tests
        run: |
          node --test scripts/dev.test.mjs
          node --test frontend/scripts/build-foliate.test.mjs
          (cd frontend && npm run test:tts:provider:cli)

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-backend-extended:
    name: Release Backend Extended
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Exercise backup restore readiness
        working-directory: backend
        run: go test ./backup -run '^TestCreateVerifyRestoreAndReady$' -count=1

      - name: Verify backend coverage baseline
        working-directory: backend
        run: |
          go test ./backup ./handlers ./middleware ./services ./storage -coverprofile=coverage.out
          go run ./cmd/check-coverage --profile coverage.out --baseline coverage-baseline.json

      - name: Scan Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release-frontend-extended:
    name: Release Frontend Extended
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend coverage baseline check
        working-directory: frontend
        run: npm run test:coverage:check

      - name: Build frontend and check JS budget
        working-directory: frontend
        run: |
          npm run build
          npm run test:js-budget

      - name: Build vendored Foliate assets
        working-directory: frontend/public/foliate
        run: |
          npm ci --ignore-scripts
          npm run build

  release-e2e-and-perf:
    name: Release E2E & Performance
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run functional E2E tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e:ci

      - name: Run production performance check
        working-directory: frontend
        env:
          CI: true
        run: npm run test:perf:production

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload production performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-performance
          path: frontend/performance-results
          retention-days: 14
          if-no-files-found: ignore

  release-visual:
    name: Release Visual Regression
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install CJK fonts for stable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run visual regression
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual -- --workers=1

      - name: Upload visual report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Refresh Linux snapshots (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual:update -- --workers=1

      - name: Upload refreshed Linux snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-linux
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/linux
          retention-days: 7

  release-docker:
    name: Release Docker Smoke Check
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: z-reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container lifecycle
        run: bash docker/smoke-test.sh z-reader:ci

  publish-image:
    name: Publish verified image
    needs:
      - changes
      - backend
      - frontend
      - release-backend-extended
      - release-frontend-extended
      - release-e2e-and-perf
      - release-visual
      - release-docker
    if: >-
      ${{ !cancelled()
        && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image))
        && needs.changes.outputs.publish == 'true'
        && needs.changes.result == 'success'
        && needs.backend.result == 'success'
        && needs.frontend.result == 'success'
        && needs.release-docker.result == 'success'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.release-backend-extended.result == 'skipped'
          && needs.release-frontend-extended.result == 'skipped'
          && needs.release-e2e-and-perf.result == 'skipped'
          && needs.release-visual.result == 'skipped')
          || (needs.release-backend-extended.result == 'success'
          && needs.release-frontend-extended.result == 'success'
          && needs.release-e2e-and-perf.result == 'success'
          && needs.release-visual.result == 'success')) }}
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
