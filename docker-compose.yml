services:
  z-reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zuoban/z-reader:latest
    container_name: z-reader
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      - APP_PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/data/data.db
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-268435456}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      - TTS_CACHE_DIR=/app/data/tts-cache
      - TTS_CACHE_MAX_BYTES=${TTS_CACHE_MAX_BYTES:-67108864}
      - TTS_CACHE_MAX_ITEMS=${TTS_CACHE_MAX_ITEMS:-128}
      - TTS_CACHE_TTL_SECONDS=${TTS_CACHE_TTL_SECONDS:-86400}
      - TTS_MAX_CONCURRENCY=${TTS_MAX_CONCURRENCY:-3}
      - TTS_MAX_QUEUED=${TTS_MAX_QUEUED:-12}
      - TTS_QUEUE_WAIT_SECONDS=${TTS_QUEUE_WAIT_SECONDS:-30}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - BACKUP_DIR=/app/data/backups
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      # Use a domain such as reader.example.com to enable Caddy-managed HTTPS.
      # The local default (:80) remains convenient for development.
      - CADDY_SITE=${CADDY_SITE:-:80}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:8080/readyz >/dev/null && wget -qO- --tries=1 http://127.0.0.1:3000/login >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
