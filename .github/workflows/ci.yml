name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.serena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: 'Also upload updated visual snapshots artifact (does not commit)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Exercise backup restore readiness
        working-directory: backend
        run: go test ./backup -run '^TestCreateVerifyRestoreAndReady$' -count=1

      - name: Verify backend coverage baseline
        working-directory: backend
        run: |
          go test ./handlers ./middleware ./services ./storage -coverprofile=coverage.out
          go run ./cmd/check-coverage --profile coverage.out --baseline coverage-baseline.json

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: Verify Go formatting
        working-directory: backend
        run: |
          unformatted="$(find . -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go static checks
        working-directory: backend
        run: go vet ./...

      - name: Scan Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint:strict

  foliate-build:
    name: Foliate Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/public/foliate/package-lock.json

      - name: Install Foliate build dependencies
        working-directory: frontend/public/foliate
        run: npm ci --ignore-scripts

      - name: Build Foliate assets
        working-directory: frontend/public/foliate
        run: npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check first-screen JS budget
        working-directory: frontend
        run: npm run test:js-budget

  frontend-unit-test:
    name: Frontend Unit & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and coverage baseline check
        working-directory: frontend
        run: npm run test:coverage:check

      - name: Upload frontend coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 14

  frontend-e2e-test:
    name: Frontend E2E (functional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run functional E2E tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  frontend-visual-test:
    name: Frontend Visual Regression
    # Hard gate against committed linux/ baselines (Noto CJK fonts).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install CJK fonts for stable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run visual regression
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual -- --workers=1

      - name: Upload visual report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Refresh Linux snapshots (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual:update -- --workers=1

      - name: Upload refreshed Linux snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/linux
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-test
      - frontend-build
      - frontend-unit-test
      - frontend-e2e-test
      - frontend-visual-test
      - foliate-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: z-reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container lifecycle
        run: bash docker/smoke-test.sh z-reader:ci
