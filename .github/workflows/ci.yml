name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.serena/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.serena/**'
  workflow_dispatch:
    inputs:
      run_heavy_checks:
        description: 'Run heavy release checks (coverage, JS budget, E2E, visual, perf, Docker)'
        type: boolean
        default: true
      update_visual_snapshots:
        description: 'Also upload updated visual snapshots artifact (does not commit)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      heavy: ${{ steps.filter.outputs.heavy }}
      visual: ${{ steps.filter.outputs.visual }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute affected scopes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          RUN_HEAVY: ${{ inputs.run_heavy_checks }}
          UPDATE_VISUAL: ${{ inputs.update_visual_snapshots }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          heavy=false
          visual=false

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            backend=true
            frontend=true
            heavy=true
            visual=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend=true
            frontend=true
            if [[ "$RUN_HEAVY" == "true" ]]; then
              heavy=true
              visual=true
            fi
            if [[ "$UPDATE_VISUAL" == "true" ]]; then
              visual=true
            fi
          else
            files=""
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              files="$(git diff --name-only HEAD^1 HEAD || true)"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$BEFORE_SHA" HEAD || true)"
            else
              backend=true
              frontend=true
            fi

            if [[ -n "$files" ]]; then
              if grep -Eq '^(backend/|\.github/workflows/ci\.yml$)' <<<"$files"; then
                backend=true
              fi
              if grep -Eq '^(frontend/|\.github/workflows/ci\.yml$)' <<<"$files"; then
                frontend=true
              fi
            fi
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "heavy=$heavy"
            echo "visual=$visual"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Run Go vet
        working-directory: backend
        run: go vet ./...

  frontend:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint:strict

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-backend-extended:
    name: Release Backend Extended
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Exercise backup restore readiness
        working-directory: backend
        run: go test ./backup -run '^TestCreateVerifyRestoreAndReady$' -count=1

      - name: Verify backend coverage baseline
        working-directory: backend
        run: |
          go test ./handlers ./middleware ./services ./storage -coverprofile=coverage.out
          go run ./cmd/check-coverage --profile coverage.out --baseline coverage-baseline.json

      - name: Verify Go formatting
        working-directory: backend
        run: |
          unformatted="$(find . -name '*.go' -type f -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Scan Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release-frontend-extended:
    name: Release Frontend Extended
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend coverage baseline check
        working-directory: frontend
        run: npm run test:coverage:check

      - name: Build frontend and check JS budget
        working-directory: frontend
        run: |
          npm run build
          npm run test:js-budget
          node --test scripts/build-foliate.test.mjs

      - name: Build vendored Foliate assets
        working-directory: frontend/public/foliate
        run: |
          npm ci --ignore-scripts
          npm run build

  release-e2e-and-perf:
    name: Release E2E & Performance
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run functional E2E tests
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e:ci

      - name: Run production performance check
        working-directory: frontend
        env:
          CI: true
        run: npm run test:perf:production

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload production performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance
          path: frontend/performance-results
          retention-days: 14
          if-no-files-found: ignore

  release-visual:
    name: Release Visual Regression
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install CJK fonts for stable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run visual regression
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual -- --workers=1

      - name: Upload visual report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Refresh Linux snapshots (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        working-directory: frontend
        env:
          CI: true
        run: npm run test:visual:update -- --workers=1

      - name: Upload refreshed Linux snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: frontend/tests/e2e/visual-regression.spec.ts-snapshots/linux
          retention-days: 7

  release-docker:
    name: Release Docker Smoke Check
    needs:
      - changes
      - backend
      - frontend
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: z-reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container lifecycle
        run: bash docker/smoke-test.sh z-reader:ci
