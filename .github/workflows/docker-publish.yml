name: Build and Push Docker Image

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      # Branches and stable tags can both write the latest alias.
      group: ghcr-publish
      queue: max
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Verify the ref still points to the verified commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            ls-remote --exit-code origin "$GITHUB_REF" "${GITHUB_REF}^{}")
          # For annotated tags, use the peeled commit rather than the tag object.
          current_sha=$(awk -v ref="$GITHUB_REF" '
            $2 == ref { sha = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled ? peeled : sha) }
          ' <<<"$refs")
          verified_sha=$(git rev-parse HEAD)
          if [[ "$current_sha" != "$verified_sha" ]]; then
            echo "Ref $GITHUB_REF no longer points to $verified_sha. Publication stopped."
            exit 1
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
